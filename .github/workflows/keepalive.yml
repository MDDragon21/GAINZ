name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days of inactivity, which makes
# the apps hang on "LADE‚Ä¶". This job pokes each project twice a week so the
# inactivity timer never runs out. Publishable keys are safe to be public
# (Supabase: "Publishable keys can be safely shared publicly").

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays & Thursdays, 06:17 UTC
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: gainz
            url: https://solnmzpdygzlgpzalkry.supabase.co
            key: sb_publishable_-A2ZBpZ8vXy01ozvBUuuyA_KD2dMC0d
          - name: union-klosterfelde
            url: https://vgtjnddztxfhssvdnxpn.supabase.co
            key: sb_publishable_2zNnMONeod3ydsLX_0RR5Q_0PFG9FRA
    steps:
      - name: Ping ${{ matrix.project.name }}
        run: |
          URL="${{ matrix.project.url }}"
          KEY="${{ matrix.project.key }}"
          echo "== ${{ matrix.project.name }} :: $URL =="
          h=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/auth/v1/health" -H "apikey: $KEY")
          echo "auth/health -> $h"
          r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                "$URL/rest/v1/keepalive_ping?select=1&limit=1" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "rest query  -> $r"
          # A reachable project answers health with 200. Anything else = likely
          # paused/unreachable, so fail loudly to surface it in the run log.
          if [ "$h" != "200" ]; then
            echo "::warning::${{ matrix.project.name }} health returned $h (may be paused)"
            exit 1
          fi
          echo "ok"
